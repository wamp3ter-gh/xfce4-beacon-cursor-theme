    <path d="M12.5 2 H19.5 V22 L16 29 L12.5 22 Z" fill="none" stroke="@OUTER@" stroke-width="{O}"/>
    <path d="M12.5 2 H19.5 V22 L16 29 L12.5 22 Z" fill="@FILL@" stroke="@INNER@" stroke-width="{I}"/>
    <path d="M12.5 7 H19.5 M12.5 22 H19.5" fill="none" stroke="@OUTER@" stroke-width="1.5"/>
    <path d="M14.6 25.8 L16 29 L17.4 25.8 Z" fill="@OUTER@"/>
  </g>
