  <!-- spinner: thick ring in the theme colour with a dark arc turned by @SPIN@ each frame -->
  <g fill="none" stroke-linecap="round">
    <circle cx="16" cy="16" r="10" stroke="@OUTER@" stroke-width="{5+O}"/>
    <circle cx="16" cy="16" r="10" stroke="@INNER@" stroke-width="{5+I}"/>
    <circle cx="16" cy="16" r="10" stroke="@FILL@" stroke-width="5"/>
    <path transform="rotate(@SPIN@ 16 16)" d="M26 16 A10 10 0 0 1 16 26" stroke="@OUTER@" stroke-width="5"/>
  </g>
</svg>
