  <!-- corner bracket, no arrow; drawn for ul_angle, rotated by @ROT@ for ur, lr, ll.
       Line art: @OUTER@ and @INNER@ rings around a @FILL@ stroke 3 wide. -->
  <g transform="rotate(@ROT@ 16 16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 24 V6 H24" stroke="@OUTER@" stroke-width="{3+O}"/>
    <path d="M6 24 V6 H24" stroke="@INNER@" stroke-width="{3+I}"/>
    <path d="M6 24 V6 H24" stroke="@FILL@" stroke-width="3"/>
  </g>
</svg>
