  <!-- T: a bar with a stem; drawn for top_tee, rotated by @ROT@ for right, bottom, left.
       Line art: @OUTER@ and @INNER@ rings around a @FILL@ stroke 3 wide. -->
  <g transform="rotate(@ROT@ 16 16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 5 H26 M16 5 V27" stroke="@OUTER@" stroke-width="{3+O}"/>
    <path d="M6 5 H26 M16 5 V27" stroke="@INNER@" stroke-width="{3+I}"/>
    <path d="M6 5 H26 M16 5 V27" stroke="@FILL@" stroke-width="3"/>
  </g>
</svg>
