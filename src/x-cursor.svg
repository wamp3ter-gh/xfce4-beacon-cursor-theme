  <!-- bold X. Line art: @OUTER@ and @INNER@ rings around a @FILL@ stroke 5 wide. -->
  <g fill="none" stroke-linecap="round">
    <path d="M8 8 L24 24 M24 8 L8 24" stroke="@OUTER@" stroke-width="{5+O}"/>
    <path d="M8 8 L24 24 M24 8 L8 24" stroke="@INNER@" stroke-width="{5+I}"/>
    <path d="M8 8 L24 24 M24 8 L8 24" stroke="@FILL@" stroke-width="5"/>
  </g>
</svg>
