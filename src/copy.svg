  <!-- two stacked documents, no pointer; hotspot at the centre.
       The back page is drawn whole first, then the front page with its rings cuts across it. -->
  <rect x="4" y="3" width="15" height="19" rx="2" fill="none" stroke="@OUTER@" stroke-width="{O}"/>
  <rect x="4" y="3" width="15" height="19" rx="2" fill="@FILL@" stroke="@INNER@" stroke-width="{I}"/>
  <rect x="13" y="10" width="15" height="19" rx="2" fill="none" stroke="@OUTER@" stroke-width="{4+O}"/>
  <rect x="13" y="10" width="15" height="19" rx="2" fill="@FILL@" stroke="@INNER@" stroke-width="{I}"/>
  <path d="M16.5 15.5 H24.5 M16.5 19.5 H24.5 M16.5 23.5 H22" fill="none" stroke="@OUTER@" stroke-width="1.8" stroke-linecap="round"/>
</svg>
