  <!-- move: four short chevrons around a centre dot, with a gap between neighbours.
       Line art: @OUTER@ and @INNER@ rings around a @FILL@ stroke 3 wide. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 6.5 L16 3.5 L19 6.5 M13 25.5 L16 28.5 L19 25.5 M6.5 13 L3.5 16 L6.5 19 M25.5 13 L28.5 16 L25.5 19" stroke="@OUTER@" stroke-width="{3+O}"/>
    <path d="M13 6.5 L16 3.5 L19 6.5 M13 25.5 L16 28.5 L19 25.5 M6.5 13 L3.5 16 L6.5 19 M25.5 13 L28.5 16 L25.5 19" stroke="@INNER@" stroke-width="{3+I}"/>
    <path d="M13 6.5 L16 3.5 L19 6.5 M13 25.5 L16 28.5 L19 25.5 M6.5 13 L3.5 16 L6.5 19 M25.5 13 L28.5 16 L25.5 19" stroke="@FILL@" stroke-width="3"/>
  </g>
  <circle cx="16" cy="16" r="2.5" fill="none" stroke="@OUTER@" stroke-width="{O}"/>
  <circle cx="16" cy="16" r="2.5" fill="@FILL@" stroke="@INNER@" stroke-width="{I}"/>
</svg>
