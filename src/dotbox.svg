<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- SPDX-License-Identifier: CC-BY-NC-SA-4.0 -->
  <!-- SPDX-FileCopyrightText: 2026 Wampeter Foma -->
  <!-- box with a centre dot (dotbox, target, icon, draped_box); hotspot at the dot.
       Line art: @OUTER@ and @INNER@ rings around a @FILL@ stroke 3 wide. -->
  <g stroke-linejoin="round">
    <rect x="6" y="6" width="20" height="20" rx="1" fill="none" stroke="@OUTER@" stroke-width="{3+O}"/>
    <circle cx="16" cy="16" r="2.5" fill="@OUTER@" stroke="@OUTER@" stroke-width="{O}"/>
    <rect x="6" y="6" width="20" height="20" rx="1" fill="none" stroke="@INNER@" stroke-width="{3+I}"/>
    <circle cx="16" cy="16" r="2.5" fill="@INNER@" stroke="@INNER@" stroke-width="{I}"/>
    <rect x="6" y="6" width="20" height="20" rx="1" fill="none" stroke="@FILL@" stroke-width="3"/>
    <circle cx="16" cy="16" r="2.5" fill="@FILL@"/>
  </g>
</svg>
